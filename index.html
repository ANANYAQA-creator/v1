<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For My Love ❤️</title>

<style>

body{
    margin:0;
    overflow:hidden;
    font-family:'Georgia', serif;
    background: linear-gradient(to bottom, #ff9a9e, #fad0c4);
    text-align:center;
}

h1{
    color:white;
    margin-top:30px;
    font-size:3.5em;
}

/* Floating hearts */
.heart{
    position:fixed;
    bottom:-40px;
    font-size:30px;
    animation:floatUp 6s linear forwards;
}

@keyframes floatUp{
    to{
        transform:translateY(-110vh);
        opacity:0;
    }
}

.images{
    display:flex;
    justify-content:center;
    gap:40px;
    margin:30px;
    flex-wrap:wrap;
}

.images img{
    width:300px;
    height:420px;
    object-fit:cover;
    border-radius:15px;
    border:4px solid white;
}

.buttons{
    position:relative;
    height:140px;
}

button{
    font-size:1.3em;
    padding:12px 26px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    position:absolute;
}

#yes{
    background:#ff4b5c;
    color:white;
    left:50%;
    transform:translateX(-130%);
}

#no{
    background:#eee;
    left:50%;
    transform:translateX(30%);
}

/* POPUP */
.popup{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.7);
    display:none;
    align-items:center;
    justify-content:center;
}

/* Envelope */
.envelope{
    width:420px;
    height:260px;
    background:#ff4b5c;
    position:relative;
    border-radius:8px;
    cursor:pointer;
    animation:pop .6s ease;
}

@keyframes pop{
    from{transform:scale(.5);opacity:0}
    to{transform:scale(1);opacity:1}
}

/* flap */
.envelope:before{
    content:"";
    position:absolute;
    width:0;
    height:0;
    border-left:210px solid transparent;
    border-right:210px solid transparent;
    border-bottom:130px solid #ff758c;
    top:-130px;
    left:0;
    transform-origin:bottom;
    transition:.8s;
}

.envelope.open:before{
    transform:rotateX(180deg);
}

/* letter */
.letter{
    position:absolute;
    width:90%;
    height:90%;
    background:#fffdf7;
    top:5%;
    left:5%;
    border-radius:6px;
    padding:25px;
    box-sizing:border-box;
    transform:translateY(40px);
    opacity:0;
    transition:.8s;
    overflow:hidden;
}

.envelope.open .letter{
    transform:translateY(-120px);
    opacity:1;
}

#typeText{
    font-size:1.25em;
    line-height:1.7em;
    color:#444;
    white-space:pre-line;
}

/* Fireworks canvas */
canvas{
    position:fixed;
    top:0;
    left:0;
    pointer-events:none;
}

.no-message{
    background:white;
    padding:30px;
    border-radius:12px;
    font-size:1.5em;
    color:#ff4b5c;
}

</style>
</head>

<body>

<canvas id="fireworks"></canvas>

<h1>Will You Be My Valentine? ❤️</h1>

<div class="images">
    <img src="your_photo.jpg">
    <img src="girlfriend_photo.jpg">
</div>

<div class="buttons">
    <button id="yes">YES</button>
    <button id="no">NO</button>
</div>

<!-- Envelope Popup -->
<div class="popup" id="popup">
    <div class="envelope" id="envelope">
        <div class="letter">
            <div id="typeText"></div>
        </div>
    </div>
</div>

<!-- NO popup -->
<div class="popup" id="noPopup">
    <div class="no-message">
        Iska koi option nahi hain apke paas 😜 <br>
        Aapko "YES" par hi click karna padega ❤️
    </div>
</div>

<script>

/* CHANGE NAME HERE */
const loverName = "Swati";

const message = `Dear ${loverName} ❤️,\n\nFrom the moment you walked into my life, everything became more beautiful.\n\nYou are not just my love — you are my peace, my happiness, and my forever home.\n\nI promise to stand beside you, laugh with you, support you, and love you more with every passing day.\n\nHappy Valentine's Day 💕\n\nForever Yours ❤️`;


/* hearts */
setInterval(()=>{
    const h=document.createElement("div");
    h.className="heart";
    h.innerHTML="❤️";
    h.style.left=Math.random()*100+"vw";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),6000);
},400);


/* YES */
const yes=document.getElementById("yes");
const popup=document.getElementById("popup");
const envelope=document.getElementById("envelope");
const text=document.getElementById("typeText");

yes.onclick=()=>{
    popup.style.display="flex";
    startFireworks();
};

/* open envelope */
envelope.onclick=()=>{
    envelope.classList.add("open");
    typeWriter(message, text, 35);

    setTimeout(()=>{
        popup.style.display="none";
        envelope.classList.remove("open");
        text.innerHTML="";
    },8000);
};


/* typewriter */
function typeWriter(str, el, speed){
    let i=0;
    function typing(){
        if(i<str.length){
            el.innerHTML+=str.charAt(i);
            i++;
            setTimeout(typing, speed);
        }
    }
    typing();
}


/* runaway NO */
const no=document.getElementById("no");
const noPopup=document.getElementById("noPopup");

function moveNo(){
    no.style.left=Math.random()*80+"vw";
    no.style.top=Math.random()*80+"vh";
}

["mouseenter","click","touchstart"].forEach(evt=>{
    no.addEventListener(evt,e=>{
        e.preventDefault();
        moveNo();
        noPopup.style.display="flex";
        setTimeout(()=>noPopup.style.display="none",3000);
    });
});


/* FIREWORKS */
const canvas=document.getElementById("fireworks");
const ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let particles=[];

function startFireworks(){
    for(let i=0;i<120;i++){
        particles.push({
            x:canvas.width/2,
            y:canvas.height/2,
            angle:Math.random()*2*Math.PI,
            speed:Math.random()*5+2,
            radius:Math.random()*2+1,
            life:100
        });
    }
    animateFireworks();
}

function animateFireworks(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    particles.forEach(p=>{
        p.x+=Math.cos(p.angle)*p.speed;
        p.y+=Math.sin(p.angle)*p.speed;
        p.life--;

        ctx.beginPath();
        ctx.arc(p.x,p.y,p.radius,0,Math.PI*2);
        ctx.fillStyle=`hsl(${Math.random()*360},100%,70%)`;
        ctx.fill();
    });

    particles=particles.filter(p=>p.life>0);

    if(particles.length>0){
        requestAnimationFrame(animateFireworks);
    }
}

</script>

</body>
</html>
