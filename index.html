<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>❤️For My Lovely Sweety❤️</title>

<style>

body{
    margin:0;
    overflow:hidden;
    font-family:'Georgia', serif;
    background: linear-gradient(to bottom, #ff9a9e, #fad0c4);
    text-align:center;
}

h1{
    color:white;
    margin-top:30px;
    font-size:3.5em;
}

/* Floating hearts */
.heart{
    position:fixed;
    bottom:-40px;
    font-size:30px;
    animation:floatUp 6s linear forwards;
}

@keyframes floatUp{
    to{
        transform:translateY(-110vh);
        opacity:0;
    }
}

.images{
    display:flex;
    justify-content:center;
    gap:40px;
    margin:30px;
    flex-wrap:wrap;
}

.images img{
    width:300px;
    height:420px;
    object-fit:cover;
    border-radius:15px;
    border:4px solid white;
}

.buttons{
    position:relative;
    height:140px;
}

button{
    font-size:1.3em;
    padding:12px 26px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    position:absolute;
}

#yes{
    background:#ff4b5c;
    color:white;
    left:50%;
    transform:translateX(-130%);
}

#no{
    background:#eee;
    left:50%;
    transform:translateX(30%);
}

/* POPUP */
.popup{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.7);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
}

/* Envelope - resized to fit letter perfectly */
.envelope{
    width:min(700px, 92vw);
    height:auto;
    min-height:420px;
    background:#ff4b5c;
    position:relative;
    border-radius:10px;
    animation:pop .6s ease;
}

@keyframes pop{
    from{transform:scale(.5);opacity:0}
    to{transform:scale(1);opacity:1}
}

/* flap */
.envelope:before{
    content:"";
    position:absolute;
    width:0;
    height:0;
    border-left:calc(50% + 5px) solid transparent;
    border-right:calc(50% + 5px) solid transparent;
    border-bottom:180px solid #ff758c;
    top:-180px;
    left:0;
    transform-origin:bottom;
    transition:.8s;
}

.envelope.open:before{
    transform:rotateX(180deg);
}

/* letter */
.letter{
    position:absolute;
    width:94%;
    height:auto;
    min-height:360px;
    background:#fffdf7;
    top:3%;
    left:3%;
    border-radius:8px;
    padding:40px;
    box-sizing:border-box;
    transform:translateY(40px);
    opacity:0;
    transition:.8s;
    display:flex;
    align-items:center;
    justify-content:center;
}

.envelope.open .letter{
    transform:translateY(-140px);
    opacity:1;
}

.letter p{
    font-size:1.45em;
    line-height:1.9em;
    color:#444;
    max-width:600px;
}

.no-message{
    background:white;
    padding:30px;
    border-radius:12px;
    font-size:1.5em;
    color:#ff4b5c;
}

/* Mobile optimization */
@media(max-width:600px){

h1{
    font-size:2.2em;
}

.images img{
    width:220px;
    height:300px;
}

.letter{
    padding:25px;
}

.letter p{
    font-size:1.15em;
}

}

</style>
</head>

<body>

<h1>Sweety, Will You Be My Valentine? 😍❤️</h1>

<div class="images">
    <img src="your_photo.jpg">
    <img src="girlfriend_photo.jpg">
</div>

<div class="buttons">
    <button id="yes">YES</button>
    <button id="no">NO</button>
</div>

<!-- Envelope Popup -->
<div class="popup" id="popup">
    <div class="envelope" id="envelope">
        <div class="letter">
            <p id="loveLetter"></p>
        </div>
    </div>
</div>

<!-- NO popup -->
<div class="popup" id="noPopup">
    <div class="no-message">
        😜Iska koi option nahi hain apke paas 😜 <br>
        ❤️Aapko "YES" par hi click karna padega ❤️
    </div>
</div>

<script>

/* CHANGE NAME HERE */
const loverName = "Swati";

const message = `Dear ${loverName} ❤️, From the moment you came into my life,
everything started feeling brighter, softer, and more beautiful. 
You are not just my love❤️— you are my peace, my happiness😊, and the most precious part of my world🌍.
With you, even ordinary days feel magical✨, and every moment becomes a memory I want to keep forever😉🤞🏻.
I promise to stand beside you, support you🤝🏻, make you smile when you are low,
celebrate every success with you🤩🥳, and love you more deeply with each passing day.
You are my today, my tomorrow, and my forever❤️ .
Happy Valentine's Day, my love Swati❤️ 
Forever Yours Idiot One🥰.`;


/* hearts */
setInterval(()=>{
    const h=document.createElement("div");
    h.className="heart";
    h.innerHTML="❤️";
    h.style.left=Math.random()*100+"vw";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),6000);
},400);


/* YES -> auto open envelope + show full letter */
const yes=document.getElementById("yes");
const popup=document.getElementById("popup");
const envelope=document.getElementById("envelope");
const letter=document.getElementById("loveLetter");

letter.innerText = message;

yes.onclick=()=>{
    popup.style.display="flex";

    setTimeout(()=>{
        envelope.classList.add("open");
    },200);

    // auto close after 10 seconds
    setTimeout(()=>{
        popup.style.display="none";
        envelope.classList.remove("open");
    },10000);
};


/* runaway NO */
const no=document.getElementById("no");
const noPopup=document.getElementById("noPopup");

function moveNo(){
    no.style.left=Math.random()*80+"vw";
    no.style.top=Math.random()*80+"vh";
}

["mouseenter","click","touchstart"].forEach(evt=>{
    no.addEventListener(evt,e=>{
        e.preventDefault();
        moveNo();
        noPopup.style.display="flex";
        setTimeout(()=>noPopup.style.display="none",3000);
    });
});

</script>

</body>
</html>
